<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARNO YouTube Stats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 24px 50px;
      font-family: Arial, Helvetica, sans-serif;
      background: #faf8ff;
      color: #17132d;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* HEADER */

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
      color: #6126b5;
    }

    .intro {
      margin: 0;
      padding-left: 22px;
      color: #68617d;
      font-size: 15px;
      line-height: 1.9;
    }

    .intro li::marker {
      color: #7839d8;
    }

    .top-line {
      height: 3px;
      background: #7135c7;
      margin: 24px 0 0;
      border-radius: 5px;
    }

    /* VIDEO LIST */

    #videos {
      width: 100%;
    }

    .video-row {
      position: relative;
      display: grid;
      grid-template-columns: 135px minmax(0, 1fr) 58px;
      column-gap: 20px;
      align-items: center;
      padding: 26px 0 22px;
      border-bottom: 2px solid #ddd8e9;
    }

    .thumbnail-link {
      display: block;
    }

    .thumbnail {
      width: 135px;
      height: 90px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background: #e5e1ed;
    }

    .video-info {
      min-width: 0;
    }

    .video-title {
      margin: 0 0 14px;
      color: #17132d;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
    }

    .stats-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      font-size: 16px;
    }

    .views-number,
    .likes-number {
      color: #17132d;
      font-weight: 700;
    }

    .views-label,
    .likes-label {
      color: #77718a;
    }

    .gain {
      color: #6731d0;
      font-weight: 700;
      margin-left: 2px;
    }

    /* ARROW */

    .expand-button {
      width: 52px;
      height: 52px;
      border: 1.5px solid #b18be8;
      border-radius: 50%;
      background: transparent;
      color: #7035cf;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .expand-button:hover {
      background: #f0e7ff;
    }

    .expand-button.open {
      transform: rotate(180deg);
    }

    /* PROGRESS */

    .progress-wrapper {
      grid-column: 1 / -1;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: #ded8eb;
      overflow: hidden;
      border-radius: 5px;
    }

    .progress-fill {
      height: 100%;
      background: #7135c7;
      border-radius: 5px;
      transition: width 0.4s ease;
    }

    /* DETAILS */

    .details {
      grid-column: 1 / -1;
      display: none;
      padding: 18px 0 4px 155px;
    }

    .details.open {
      display: block;
    }

    .watch-button {
      display: inline-block;
      background: #7135c7;
      color: white;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .watch-button:hover {
      background: #5e28ad;
    }

    .detail-text {
      color: #77718a;
      font-size: 13px;
      margin-left: 12px;
    }

    /* LOADING / ERROR */

    .loading {
      text-align: center;
      color: #77718a;
      padding: 50px 0;
    }

    .error {
      background: white;
      color: #a00020;
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      margin-top: 45px;
      color: #9993a8;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 650px) {

      body {
        padding: 22px 16px 40px;
      }

      h1 {
        font-size: 34px;
      }

      .intro {
        font-size: 13px;
        line-height: 1.7;
      }

      .video-row {
        grid-template-columns: 100px minmax(0, 1fr) 44px;
        column-gap: 12px;
        padding: 20px 0 18px;
      }

      .thumbnail {
        width: 100px;
        height: 67px;
      }

      .video-title {
        font-size: 15px;
        margin-bottom: 9px;
      }

      .stats-line {
        font-size: 13px;
        gap: 5px;
      }

      .expand-button {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }

      .progress-wrapper {
        margin-top: 15px;
      }

      .details {
        padding: 15px 0 2px 112px;
      }

      .watch-button {
        padding: 9px 14px;
        font-size: 13px;
      }

      .detail-text {
        display: block;
        margin: 8px 0 0;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <h1>YouTube Stats.</h1>

      <ul class="intro">
        <li>Current views and likes are updated hourly via YouTube Data API.</li>
        <li>The purple number shows views gained since the previous update.</li>
        <li>Tap the arrow to open the fancam and watch it on YouTube.</li>
      </ul>

      <div class="top-line"></div>

    </header>


    <main id="videos">

      <p class="loading">
        Loading fancams...
      </p>

    </main>


    <footer>
      Made with 💜 for ARNO Streaming Team
    </footer>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://bedxcpozjrduuhshrszh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       HELPERS
    ========================= */

    function getNumber(value) {

      const number = Number(value);

      return Number.isNaN(number)
        ? 0
        : number;
    }


    function formatNumber(value) {

      return getNumber(value).toLocaleString();
    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;
    }


    /* =========================
       GET HISTORY
    ========================= */

    async function getAllHistory() {

      const { data, error } =
        await supabaseClient
          .from("video_stats")
          .select(
            "video_id,views,likes,recorded_at"
          )
          .order(
            "recorded_at",
            {
              ascending: false
            }
          );

      if (error) {
        throw error;
      }

      return data || [];
    }


    /* =========================
       BUILD HISTORY
    ========================= */

    function buildHistoryMap(rows) {

      const map = {};

      rows.forEach(row => {

        const id =
          String(row.video_id);

        if (!map[id]) {
          map[id] = [];
        }

        /*
          Because the data is already
          newest → oldest, the first
          two records are what we need.
        */

        if (map[id].length < 2) {
          map[id].push(row);
        }

      });

      return map;
    }


    /* =========================
       LOAD VIDEOS
    ========================= */

    async function loadVideos() {

      const container =
        document.getElementById("videos");

      try {

        /* Get current YouTube data */

        const videosResult =
          await supabaseClient
            .from("videos")
            .select(
              "id,youtube_id,title,thumbnail,views,likes,active,sort_order,updated_at"
            )
            .eq("active", true);


        if (videosResult.error) {
          throw videosResult.error;
        }


        const videos =
          videosResult.data || [];


        /* Get historical data */

        const historyRows =
          await getAllHistory();


        const historyMap =
          buildHistoryMap(historyRows);


        /* Sort by views */

        videos.sort((a, b) => {

          return getNumber(b.views) -
                 getNumber(a.views);

        });


        container.innerHTML = "";


        if (videos.length === 0) {

          container.innerHTML = `
            <p class="loading">
              No fancams found.
            </p>
          `;

          return;
        }


        /* Highest views */

        const highestViews =
          Math.max(
            ...videos.map(video =>
              getNumber(video.views)
            )
          );


        /* Create each row */

        videos.forEach(video => {

          const videoId =
            String(video.id);

          const youtubeId =
            video.youtube_id || "";

          const title =
            video.title ||
            "ARNO Fancam";

          const views =
            getNumber(video.views);

          const likes =
            getNumber(video.likes);

          const thumbnail =
            video.thumbnail ||
            `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;

          const youtubeURL =
            `https://www.youtube.com/watch?v=${youtubeId}`;


          /* Get latest 2 records */

          const history =
            historyMap[videoId] || [];


          let gained = 0;


          if (history.length >= 2) {

            const newest =
              getNumber(history[0].views);

            const previous =
              getNumber(history[1].views);

            gained =
              newest - previous;

          }


          /*
            Don't show negative numbers.
          */

          gained =
            Math.max(0, gained);


          /* Progress */

          let progress = 0;

          if (highestViews > 0) {

            progress =
              (views / highestViews) * 100;

          }


          /* Create row */

          const row =
            document.createElement("article");

          row.className =
            "video-row";


          row.innerHTML = `

            <a
              class="thumbnail-link"
              href="${youtubeURL}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                class="thumbnail"
                src="${thumbnail}"
                alt="${escapeHTML(title)}"
                loading="lazy"
              >

            </a>


            <div class="video-info">

              <h2 class="video-title">
                ${escapeHTML(title)}
              </h2>


              <div class="stats-line">

                <span class="views-number">
                  ${formatNumber(views)}
                </span>

                <span class="gain">
                  (+${formatNumber(gained)})
                </span>

                <span class="views-label">
                  views
                </span>

                <span class="likes-number">
                  ${formatNumber(likes)}
                </span>

                <span class="likes-label">
                  likes
                </span>

              </div>

            </div>


            <button
              class="expand-button"
              aria-label="Show fancam"
              type="button"
            >
              ⌄
            </button>


            <div class="progress-wrapper">

              <div class="progress-bar">

                <div
                  class="progress-fill"
                  style="width: ${progress}%"
                ></div>

              </div>

            </div>


            <div class="details">

              <a
                class="watch-button"
                href="${youtubeURL}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ▶ Watch Fancam
              </a>

              <span class="detail-text">
                Updated from YouTube
              </span>

            </div>

          `;


          /* Arrow button */

          const button =
            row.querySelector(
              ".expand-button"
            );

          const details =
            row.querySelector(
              ".details"
            );


          button.addEventListener(
            "click",
            () => {

              const isOpen =
                details.classList.contains(
                  "open"
                );


              details.classList.toggle(
                "open"
              );


              button.classList.toggle(
                "open"
              );


              button.setAttribute(
                "aria-label",
                isOpen
                  ? "Show fancam"
                  : "Hide fancam"
              );

            }
          );


          container.appendChild(row);

        });


      } catch (error) {

        console.error(
          "Website error:",
          error
        );


        container.innerHTML = `

          <div class="error">

            <h2>
              Unable to load fancams
            </h2>

            <p>
              ${escapeHTML(
                error.message ||
                "Unknown error"
              )}
            </p>

          </div>

        `;

      }

    }


    /* =========================
       START
    ========================= */

    loadVideos();


    /*
      Refresh every minute.
      The actual YouTube data is
      updated hourly by Supabase.
    */

    setInterval(
      loadVideos,
      60000
    );

  </script>

</body>

</html>
