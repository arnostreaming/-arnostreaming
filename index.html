<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arno Streaming Team</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f0ff;
      font-family: Arial, sans-serif;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #6b35b5;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }
    #videos {
      max-width: 700px;
      margin: auto;
    }
    .video {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    .video img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
    .video h2 {
      font-size: 18px;
      margin: 15px 0 12px;
      color: #333;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 120px;
      background: #f5f0ff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat strong {
      display: block;
      color: #6b35b5;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .gain {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }
    .progress-title {
      margin-top: 16px;
      margin-bottom: 8px;
      color: #6b35b5;
      font-weight: bold;
    }
    .chart {
      height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px;
      background: #faf8ff;
      border-radius: 8px;
      overflow-x: auto;
    }
    .bar {
      min-width: 12px;
      background: #9b6bd3;
      border-radius: 4px 4px 0 0;
    }
    .no-history {
      text-align: center;
      color: #888;
      padding: 15px;
      font-size: 13px;
    }
    .watch {
      display: block;
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #6b35b5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px;
    }
    .error {
      color: #b00020;
      word-break: break-word;
    }
    .updated {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <h1>ARNO Streaming Team 💜</h1>
  <div class="subtitle">
    Support Arno's fancams ✨
  </div>
  <div id="videos">
    <div class="loading">Loading fancams...</div>
  </div>
  <div id="updated" class="updated"></div>
<script>
const SUPABASE_URL =
  "https://bedxcpozjrduuhshrszh.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";
function formatNumber(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) {
    return "0";
  }
  return number.toLocaleString();
}
function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
async function loadVideos() {
  const container =
    document.getElementById("videos");
  try {
    const url =
      `${SUPABASE_URL}/rest/v1/videos` +
      `?select=id,youtube_id,title,thumbnail,views,likes,active,sort_order,updated_at` +
      `&active=eq.true` +
      `&order=views.asc`;
    const response =
      await fetch(url, {
        method: "GET",
        cache: "no-store",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
    if (!response.ok) {
      const errorText =
        await response.text();
      throw new Error(
        `Supabase ${response.status}: ${errorText}`
      );
    }
    const videos =
      await response.json();
    if (!Array.isArray(videos) || videos.length === 0) {
      container.innerHTML =
        `<div class="empty">No fancams found.</div>`;
      return;
    }
    container.innerHTML =
      videos.map((video, index) => {
        const youtubeId =
          video.youtube_id || "";
        const thumbnail =
          video.thumbnail ||
          `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
        const watchUrl =
          `https://www.youtube.com/watch?v=${youtubeId}`;
        const views =
          Number(video.views) || 0;
        const likes =
          Number(video.likes) || 0;
        return `
          <div class="video">
            <img
              src="${escapeHTML(thumbnail)}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
            >
            <h2>
              ${index + 1}. ${escapeHTML(video.title)}
            </h2>
            <div class="stats">
              <div class="stat">
                <strong>
                  ${formatNumber(views)}
                </strong>
                👁️ Views
              </div>
              <div class="stat">
                <strong>
                  ${formatNumber(likes)}
                </strong>
                ❤️ Likes
              </div>
            </div>
            <a
              class="watch"
              href="${watchUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ▶ Watch on YouTube
            </a>
          </div>
        `;
      }).join("");
    document.getElementById("updated").textContent =
      `Last updated: ${new Date().toLocaleString()}`;
  }
  catch (error) {
    console.error(error);
    container.innerHTML = `
      <div class="error">
        ❌ Unable to load fancams.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
  }
}
loadVideos();
setInterval(
  loadVideos,
  60000
);
</script>
</body>
</html>
