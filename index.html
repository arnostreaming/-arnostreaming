<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arno Streaming Team</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f0ff;
      font-family: Arial, sans-serif;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #6b35b5;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #videos {
      max-width: 700px;
      margin: auto;
    }

    .video {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .video img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .video h2 {
      font-size: 18px;
      margin: 15px 0 12px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 120px;
      background: #f5f0ff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #6b35b5;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .gain {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    .progress-title {
      margin-top: 16px;
      margin-bottom: 8px;
      color: #6b35b5;
      font-weight: bold;
    }

    .chart {
      height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px;
      background: #faf8ff;
      border-radius: 8px;
      overflow-x: auto;
    }

    .bar {
      min-width: 12px;
      background: #9b6bd3;
      border-radius: 4px 4px 0 0;
    }

    .no-history {
      text-align: center;
      color: #888;
      padding: 15px;
      font-size: 13px;
    }

    .watch {
      display: block;
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #6b35b5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b00020;
    }

    .updated {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>ARNO Streaming Team 💜</h1>

  <div class="subtitle">
    Support Arno's fancams ✨
  </div>

  <div id="videos">
    <div class="loading">Loading fancams...</div>
  </div>

  <div id="updated" class="updated"></div>

<script>

const SUPABASE_URL =
  "https://bedxcpozjrduuhshrszh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";


/* =========================
   NUMBER
========================= */

function toNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return 0;
  }

  const cleaned = String(value)
    .replace(/,/g, "")
    .replace(/[^\d.-]/g, "");

  const result = Number(cleaned);

  return Number.isFinite(result) ? result : 0;
}


function formatNumber(value) {
  return toNumber(value).toLocaleString();
}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   SUPABASE
========================= */

async function getData(table, query) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  if (!response.ok) {

    const message = await response.text();

    throw new Error(
      `${table}: ${response.status} ${message}`
    );
  }

  return await response.json();
}


/* =========================
   LOAD WEBSITE
========================= */

async function loadVideos() {

  const container =
    document.getElementById("videos");

  try {

    container.innerHTML =
      `<div class="loading">Loading fancams...</div>`;


    /* -------------------------
       1. GET ALL ACTIVE VIDEOS
    ------------------------- */

    const videos = await getData(
      "videos",
      "?select=id,youtube_id,title,thumbnail,views,like,active,sort_order,updated_at&active=eq.true"
    );


    if (!videos.length) {

      container.innerHTML =
        `<div class="empty">No fancams found.</div>`;

      return;
    }


    /* -------------------------
       2. GET ALL SNAPSHOTS
    ------------------------- */

    const stats = await getData(
      "Video_stats",
      "?select=id,video_id,views,like,record_at&order=record_at.asc"
    );


    /* -------------------------
       3. PUT SNAPSHOTS
          UNDER EACH VIDEO
    ------------------------- */

    const statsByVideo = {};


    for (const stat of stats) {

      const id = String(stat.video_id);

      if (!statsByVideo[id]) {
        statsByVideo[id] = [];
      }

      statsByVideo[id].push(stat);
    }


    /* -------------------------
       4. PREPARE EACH VIDEO
    ------------------------- */

    const finalVideos = videos.map(video => {

      const id = String(video.id);

      let history =
        statsByVideo[id] || [];


      /* Oldest → newest */

      history.sort((a, b) => {

        return new Date(a.record_at) -
               new Date(b.record_at);

      });


      /* Latest snapshot */

      const latest =
        history.length
          ? history[history.length - 1]
          : null;


      /* First snapshot */

      const first =
        history.length
          ? history[0]
          : null;


      /* CURRENT VIEWS */

      const currentViews =
        latest
          ? toNumber(latest.views)
          : toNumber(video.views);


      /* CURRENT LIKES */

      const currentLikes =
        latest
          ? toNumber(latest.like)
          : toNumber(video.like);


      /* STARTING VIEWS */

      const startingViews =
        first
          ? toNumber(first.views)
          : currentViews;


      /* STARTING LIKES */

      const startingLikes =
        first
          ? toNumber(first.like)
          : currentLikes;


      return {

        ...video,

        currentViews,

        currentLikes,

        viewsGained:
          Math.max(
            0,
            currentViews - startingViews
          ),

        likesGained:
          Math.max(
            0,
            currentLikes - startingLikes
          ),

        history

      };

    });


    /* -------------------------
       5. SORT ALL 26 VIDEOS
          LOWEST → HIGHEST
    ------------------------- */

    finalVideos.sort((a, b) => {

      const aViews =
        Number(a.currentViews);

      const bViews =
        Number(b.currentViews);


      if (aViews < bViews) {
        return -1;
      }

      if (aViews > bViews) {
        return 1;
      }

      return String(a.id)
        .localeCompare(String(b.id));

    });


    /* -------------------------
       6. DISPLAY
    ------------------------- */

    container.innerHTML =
      finalVideos.map((video, index) => {


        const youtubeId =
          video.youtube_id;


        const thumbnail =
          video.thumbnail ||
          `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;


        const watch =
          `https://www.youtube.com/watch?v=${youtubeId}`;


        /* -------------------------
           HISTORY GRAPH
        ------------------------- */

        let chart = "";


        if (video.history.length) {

          const values =
            video.history.map(
              item => toNumber(item.views)
            );


          const max =
            Math.max(...values, 1);


          chart = `

            <div class="progress-title">
              Views Progress
            </div>

            <div class="chart">

              ${values.map(value => {

                const height =
                  Math.max(
                    5,
                    (value / max) * 100
                  );


                return `

                  <div
                    class="bar"
                    style="height:${height}%"
                    title="${formatNumber(value)} views">
                  </div>

                `;

              }).join("")}

            </div>

          `;

        } else {

          chart = `

            <div class="no-history">
              No history recorded yet.
            </div>

          `;

        }


        return `

          <div class="video">

            <img
              src="${escapeHTML(thumbnail)}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
            >


            <h2>
              ${index + 1}.
              ${escapeHTML(video.title)}
            </h2>


            <div class="stats">

              <div class="stat">

                <strong>
                  ${formatNumber(video.currentViews)}
                </strong>

                Views

              </div>


              <div class="stat">

                <strong>
                  ${formatNumber(video.currentLikes)}
                </strong>

                Likes

              </div>

            </div>


            <div class="gain">

              📈 Views gained:
              <strong>
                +${formatNumber(video.viewsGained)}
              </strong>

            </div>


            <div class="gain">

              ❤️ Likes gained:
              <strong>
                +${formatNumber(video.likesGained)}
              </strong>

            </div>


            ${chart}


            <a
              class="watch"
              href="${watch}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ▶ Watch on YouTube
            </a>

          </div>

        `;

      }).join("");


    document.getElementById("updated").textContent =
      `Last updated: ${new Date().toLocaleString()}`;


  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="error">

        ❌ Something went wrong.

        <br><br>

        Please check Supabase permissions.

      </div>

    `;

  }

}


/* =========================
   START
========================= */

loadVideos();


/* =========================
   REFRESH EVERY 60 SECONDS
========================= */

setInterval(
  loadVideos,
  60000
);

</script>

</body>
</html>
