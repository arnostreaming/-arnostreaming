<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARNO Streaming Team</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      color: #222;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #6b35b5;
      font-size: 32px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 16px;
    }
    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .video {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
    }
    .thumbnail {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #ddd;
    }
    .video-content {
      padding: 18px;
    }
    .video h2 {
      color: #333;
      font-size: 19px;
      margin: 0 0 15px;
    }
    .stats {
      display: flex;
      gap: 18px;
      margin-bottom: 16px;
      color: #666;
      font-size: 15px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .watch-button {
      display: inline-block;
      background: #6b35b5;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: bold;
      text-decoration: none;
    }
    .watch-button:hover {
      opacity: 0.85;
    }
    .loading {
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }
    .error {
      background: white;
      color: #b00020;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      grid-column: 1 / -1;
      word-break: break-word;
    }
    .error h2 {
      margin-top: 0;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #888;
      font-size: 13px;
    }
    .updated {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ARNO Streaming Team 💜</h1>
    <p class="subtitle">
      Support Arno's fancams! 🎬
    </p>
    <p class="updated" id="updated">
      Loading fancams...
    </p>
  </header>
  <main id="videos">
    <p class="loading">
      Loading fancams...
    </p>
  </main>
  <footer>
    Made with 💜 for ARNO Streaming Team
  </footer>
  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================
    const SUPABASE_URL =
      "https://bedxcpozjrduuhshrszh.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );
    // ==========================================
    // FORMAT NUMBERS
    // ==========================================
    function formatNumber(number) {
      return Number(number || 0).toLocaleString();
    }
    // ==========================================
    // ESCAPE HTML
    // ==========================================
    function escapeHTML(text) {
      const div =
        document.createElement("div");
      div.textContent =
        text;
      return div.innerHTML;
    }
    // ==========================================
    // LOAD ALL FANCAMS
    // LOWEST VIEWS → HIGHEST VIEWS
    // ==========================================
    async function loadVideos() {
      const container =
        document.getElementById("videos");
      const updated =
        document.getElementById("updated");
      try {
        const { data, error } =
          await supabaseClient
            .from("videos")
            .select(
              "youtube_id, title, views, likes, active"
            )
            .eq("active", true)
            .order(
              "views",
              {
                ascending: true
              }
            );
        // ==========================================
        // CHECK SUPABASE ERROR
        // ==========================================
        if (error) {
          throw error;
        }
        // ==========================================
        // CLEAR LOADING
        // ==========================================
        container.innerHTML = "";
        // ==========================================
        // NO VIDEOS
        // ==========================================
        if (!data || data.length === 0) {
          container.innerHTML = `
            <p class="loading">
              No fancams found.
            </p>
          `;
          updated.textContent =
            "No fancams available.";
          return;
        }
        // ==========================================
        // CREATE CARD FOR EVERY FANCAM
        // ==========================================
        data.forEach(video => {
          const youtubeId =
            video.youtube_id;
          const title =
            video.title ||
            "ARNO Fancam";
          const views =
            formatNumber(
              video.views
            );
          const likes =
            formatNumber(
              video.likes
            );
          // ==========================================
          // YOUTUBE THUMBNAIL
          // ==========================================
          const thumbnail =
            `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
          // ==========================================
          // YOUTUBE URL
          // ==========================================
          const youtubeURL =
            `https://www.youtube.com/watch?v=${youtubeId}`;
          // ==========================================
          // CREATE CARD
          // ==========================================
          const card =
            document.createElement("article");
          card.className =
            "video";
          card.innerHTML = `
            <a
              href="${youtubeURL}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="thumbnail"
                src="${thumbnail}"
                alt="${escapeHTML(title)}"
                loading="lazy"
              >
            </a>
            <div class="video-content">
              <h2>
                ${escapeHTML(title)}
              </h2>
              <div class="stats">
                <div class="stat">
                  👁️ ${views} views
                </div>
                <div class="stat">
                  ❤️ ${likes} likes
                </div>
              </div>
              <a
                class="watch-button"
                href="${youtubeURL}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ▶ Watch Fancam
              </a>
            </div>
          `;
          container.appendChild(card);
        });
        // ==========================================
        // LAST UPDATED
        // ==========================================
        const now =
          new Date();
        updated.textContent =
          "Updated: " +
          now.toLocaleTimeString();
      } catch (error) {
        console.error(
          "Supabase error:",
          error
        );
        container.innerHTML = `
          <div class="error">
            <h2>
              Unable to load fancams
            </h2>
            <p>
              ${escapeHTML(
                error.message ||
                String(error)
              )}
            </p>
          </div>
        `;
        updated.textContent =
          "Unable to update fancams.";
      }
    }
    // ==========================================
    // LOAD WHEN PAGE OPENS
    // ==========================================
    loadVideos();
    // ==========================================
    // REFRESH EVERY 60 SECONDS
    // ==========================================
    setInterval(
      loadVideos,
      60000
    );
  </script>
</body>
</html>
