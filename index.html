<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arno Streaming Team</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f0ff;
      font-family: Arial, sans-serif;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #6b35b5;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #videos {
      max-width: 700px;
      margin: auto;
    }

    .video {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .video img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .video h2 {
      font-size: 18px;
      margin: 15px 0 10px;
      color: #333;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .stat {
      background: #f5f0ff;
      padding: 10px;
      border-radius: 8px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #6b35b5;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .gain {
      margin: 8px 0;
      color: #555;
      font-size: 14px;
    }

    .progress-title {
      margin-top: 15px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #6b35b5;
    }

    .chart {
      height: 130px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px;
      background: #faf8ff;
      border-radius: 8px;
      overflow-x: auto;
    }

    .bar {
      min-width: 12px;
      background: #9b6bd3;
      border-radius: 4px 4px 0 0;
    }

    .no-history {
      color: #888;
      font-size: 13px;
      text-align: center;
      padding: 15px;
    }

    .watch {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #6b35b5;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }

    .watch:hover {
      opacity: 0.9;
    }

    .updated {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <h1>ARNO Streaming Team 💜</h1>

  <div class="subtitle">
    Support Arno's fancams ✨
  </div>

  <div id="videos">
    <div class="loading">Loading fancams...</div>
  </div>

  <div class="updated" id="updated"></div>

<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://bedxcpozjrduuhshrszh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";


  /* ==============================
     HELPERS
  ============================== */

  function numberValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return 0;
    }

    const cleaned = String(value)
      .replace(/,/g, "")
      .replace(/[^\d.-]/g, "");

    const number = Number(cleaned);

    return Number.isFinite(number) ? number : 0;
  }


  function formatNumber(value) {

    return numberValue(value).toLocaleString();
  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ==============================
     SUPABASE REQUEST
  ============================== */

  async function supabaseFetch(table, query = "") {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/${table}${query}`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        }
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        `${table}: ${response.status} ${errorText}`
      );
    }

    return response.json();
  }


  /* ==============================
     LOAD ALL FANCAMS
  ============================== */

  async function loadVideos() {

    const container = document.getElementById("videos");

    try {

      container.innerHTML =
        `<div class="loading">Loading fancams...</div>`;


      /* Get all active fancams */

      const videos = await supabaseFetch(
        "videos",
        "?select=id,youtube_id,title,thumbnail,views,like,active,sort_order,updated_at&active=eq.true&order=sort_order.asc"
      );


      if (!videos || videos.length === 0) {

        container.innerHTML =
          `<div class="empty">No fancams found.</div>`;

        return;
      }


      /* Get ALL history */

      const stats = await supabaseFetch(
        "Video_stats",
        "?select=id,video_id,views,like,record_at&order=record_at.asc"
      );


      /* ==============================
         GROUP HISTORY BY VIDEO
      ============================== */

      const history = {};

      for (const stat of stats) {

        const videoId = String(stat.video_id);

        if (!history[videoId]) {
          history[videoId] = [];
        }

        history[videoId].push(stat);
      }


      /* ==============================
         PREPARE VIDEOS
      ============================== */

      const preparedVideos = videos.map(video => {

        const videoId = String(video.id);

        let videoHistory =
          history[videoId] || [];


        /* Sort history oldest → newest */

        videoHistory.sort((a, b) => {

          return new Date(a.record_at).getTime()
               - new Date(b.record_at).getTime();

        });


        /* Latest snapshot */

        const latest =
          videoHistory.length > 0
            ? videoHistory[videoHistory.length - 1]
            : null;


        /* Current numbers */

        const currentViews =
          latest
            ? numberValue(latest.views)
            : numberValue(video.views);


        const currentLikes =
          latest
            ? numberValue(latest.like)
            : numberValue(video.like);


        /* First snapshot */

        const first =
          videoHistory.length > 0
            ? videoHistory[0]
            : null;


        const firstViews =
          first
            ? numberValue(first.views)
            : currentViews;


        const firstLikes =
          first
            ? numberValue(first.like)
            : currentLikes;


        const viewsGained =
          Math.max(0, currentViews - firstViews);


        const likesGained =
          Math.max(0, currentLikes - firstLikes);


        return {

          ...video,

          currentViews,
          currentLikes,

          viewsGained,
          likesGained,

          history: videoHistory

        };

      });


      /* ==============================
         LOWEST VIEWS → HIGHEST VIEWS
      ============================== */

      preparedVideos.sort((a, b) => {

        return a.currentViews - b.currentViews;

      });


      /* ==============================
         DISPLAY
      ============================== */

      container.innerHTML =
        preparedVideos.map((video, index) => {

          const youtubeId =
            video.youtube_id;


          const thumbnail =
            video.thumbnail ||
            `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;


          const watchUrl =
            `https://www.youtube.com/watch?v=${youtubeId}`;


          let chartHTML = "";


          if (video.history.length > 0) {

            const values =
              video.history.map(
                item => numberValue(item.views)
              );


            const max =
              Math.max(...values, 1);


            chartHTML = `
              <div class="progress-title">
                Views Progress
              </div>

              <div class="chart">

                ${values.map(value => {

                  const height =
                    Math.max(
                      5,
                      (value / max) * 100
                    );

                  return `
                    <div
                      class="bar"
                      style="height:${height}%"
                      title="${formatNumber(value)} views">
                    </div>
                  `;

                }).join("")}

              </div>
            `;

          } else {

            chartHTML = `
              <div class="no-history">
                No history recorded yet.
              </div>
            `;

          }


          return `

            <div class="video">

              <img
                src="${escapeHTML(thumbnail)}"
                alt="${escapeHTML(video.title)}"
                loading="lazy"
              >

              <h2>
                ${index + 1}. ${escapeHTML(video.title)}
              </h2>


              <div class="stats">

                <div class="stat">

                  <strong>
                    ${formatNumber(video.currentViews)}
                  </strong>

                  Views

                </div>


                <div class="stat">

                  <strong>
                    ${formatNumber(video.currentLikes)}
                  </strong>

                  Likes

                </div>

              </div>


              <div class="gain">

                📈 Views gained:
                <strong>
                  +${formatNumber(video.viewsGained)}
                </strong>

              </div>


              <div class="gain">

                ❤️ Likes gained:
                <strong>
                  +${formatNumber(video.likesGained)}
                </strong>

              </div>


              ${chartHTML}


              <a
                class="watch"
                href="${watchUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ▶ Watch on YouTube
              </a>

            </div>

          `;

        }).join("");


      /* ==============================
         UPDATED TIME
      ============================== */

      document.getElementById("updated").textContent =
        `Last updated: ${new Date().toLocaleString()}`;


    } catch (error) {

      console.error(error);

      container.innerHTML = `

        <div class="error">

          ❌ Unable to load fancams.

          <br><br>

          Please check the Supabase tables and RLS policies.

        </div>

      `;

    }

  }


  /* ==============================
     FIRST LOAD
  ============================== */

  loadVideos();


  /* ==============================
     AUTO REFRESH
     EVERY 60 SECONDS
  ============================== */

  setInterval(
    loadVideos,
    60000
  );

</script>

</body>
</html>
