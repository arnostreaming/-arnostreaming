<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arno Streaming Team</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f0ff;
      font-family: Arial, sans-serif;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #6b35b5;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #videos {
      max-width: 700px;
      margin: auto;
    }

    .video {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .video img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .video h2 {
      font-size: 18px;
      margin: 15px 0 12px;
      color: #333;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 120px;
      background: #f5f0ff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #6b35b5;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .gain {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    .progress-title {
      margin-top: 16px;
      margin-bottom: 8px;
      color: #6b35b5;
      font-weight: bold;
    }

    .chart {
      height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 10px;
      background: #faf8ff;
      border-radius: 8px;
      overflow-x: auto;
    }

    .bar {
      min-width: 12px;
      background: #9b6bd3;
      border-radius: 4px 4px 0 0;
    }

    .no-history {
      text-align: center;
      color: #888;
      padding: 15px;
      font-size: 13px;
    }

    .watch {
      display: block;
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      background: #6b35b5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .watch:hover {
      opacity: 0.9;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b00020;
    }

    .updated {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>ARNO Streaming Team 💜</h1>

  <div class="subtitle">
    Support Arno's fancams ✨
  </div>

  <div id="videos">
    <div class="loading">Loading fancams...</div>
  </div>

  <div id="updated" class="updated"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://bedxcpozjrduuhshrszh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dcDicY1qZyD0grDVw_cDwg_eHkt1MD8";


/* =========================================
   NUMBER HELPER
========================================= */

function toNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return 0;
  }

  const cleaned = String(value)
    .replace(/,/g, "")
    .replace(/[^\d.-]/g, "");

  const number = Number(cleaned);

  return Number.isFinite(number)
    ? number
    : 0;
}


/* =========================================
   FORMAT NUMBERS
========================================= */

function formatNumber(value) {
  return toNumber(value).toLocaleString();
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================
   SUPABASE REQUEST
========================================= */

async function getData(table, query) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      }
    }
  );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      `${table}: ${response.status} ${errorText}`
    );
  }


  return await response.json();
}


/* =========================================
   LOAD VIDEOS
========================================= */

async function loadVideos() {

  const container =
    document.getElementById("videos");


  try {

    container.innerHTML =
      `<div class="loading">Loading fancams...</div>`;


    /* =====================================
       GET ALL ACTIVE VIDEOS
    ===================================== */

    const videos = await getData(
      "videos",
      "?select=id,youtube_id,title,thumbnail,views,like,active,sort_order,updated_at&active=eq.true"
    );


    if (!videos || videos.length === 0) {

      container.innerHTML =
        `<div class="empty">No fancams found.</div>`;

      return;
    }


    /* =====================================
       GET HISTORY
    ===================================== */

    let stats = [];


    try {

      stats = await getData(
        "Video_stats",
        "?select=id,video_id,views,like,record_at&order=record_at.asc"
      );

    } catch (statsError) {

      console.warn(
        "Video_stats could not be loaded:",
        statsError
      );

      /*
        The website can still work using
        the current values from videos.
      */

      stats = [];
    }


    /* =====================================
       GROUP HISTORY BY VIDEO ID
    ===================================== */

    const statsByVideo = {};


    for (const stat of stats) {

      const videoId =
        String(stat.video_id);


      if (!statsByVideo[videoId]) {

        statsByVideo[videoId] = [];

      }


      statsByVideo[videoId].push(stat);
    }


    /* =====================================
       PREPARE VIDEOS
    ===================================== */

    const finalVideos =
      videos.map(video => {

        const videoId =
          String(video.id);


        const history =
          statsByVideo[videoId] || [];


        /*
          CURRENT VALUES COME DIRECTLY
          FROM THE videos TABLE.
        */

        const currentViews =
          toNumber(video.views);


        const currentLikes =
          toNumber(video.like);


        /*
          HISTORY
        */

        let firstViews =
          currentViews;


        let firstLikes =
          currentLikes;


        if (history.length > 0) {

          const sortedHistory =
            [...history].sort(
              (a, b) =>
                new Date(a.record_at).getTime() -
                new Date(b.record_at).getTime()
            );


          firstViews =
            toNumber(sortedHistory[0].views);


          firstLikes =
            toNumber(sortedHistory[0].like);

        }


        return {

          ...video,

          currentViews,

          currentLikes,

          viewsGained:
            Math.max(
              0,
              currentViews - firstViews
            ),

          likesGained:
            Math.max(
              0,
              currentLikes - firstLikes
            ),

          history

        };

      });


    /* =====================================
       IMPORTANT SORT
       
       LOWEST VIEWS
       ↓
       HIGHEST VIEWS
       
       Chain = 1,266,761
       Therefore Chain should be LAST.
    ===================================== */

    finalVideos.sort((a, b) => {

      const viewsA =
        Number(a.views) || 0;


      const viewsB =
        Number(b.views) || 0;


      return viewsA - viewsB;

    });


    /* =====================================
       DISPLAY
    ===================================== */

    container.innerHTML =
      finalVideos.map((video, index) => {


        const youtubeId =
          video.youtube_id;


        const thumbnail =
          video.thumbnail ||
          `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;


        const watchUrl =
          `https://www.youtube.com/watch?v=${youtubeId}`;


        /* =================================
           HISTORY CHART
        ================================= */

        let chartHTML = "";


        if (video.history.length > 0) {

          const history =
            [...video.history].sort(
              (a, b) =>
                new Date(a.record_at).getTime() -
                new Date(b.record_at).getTime()
            );


          const values =
            history.map(
              item =>
                toNumber(item.views)
            );


          const max =
            Math.max(...values, 1);


          chartHTML = `

            <div class="progress-title">
              Views Progress
            </div>

            <div class="chart">

              ${values.map(value => {

                const height =
                  Math.max(
                    5,
                    (value / max) * 100
                  );


                return `

                  <div
                    class="bar"
                    style="height:${height}%"
                    title="${formatNumber(value)} views">
                  </div>

                `;

              }).join("")}

            </div>

          `;

        } else {

          chartHTML = `

            <div class="no-history">
              No history recorded yet.
            </div>

          `;

        }


        /* =================================
           VIDEO CARD
        ================================= */

        return `

          <div class="video">

            <img
              src="${escapeHTML(thumbnail)}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
            >


            <h2>
              ${index + 1}.
              ${escapeHTML(video.title)}
            </h2>


            <div class="stats">

              <div class="stat">

                <strong>
                  ${formatNumber(video.currentViews)}
                </strong>

                Views

              </div>


              <div class="stat">

                <strong>
                  ${formatNumber(video.currentLikes)}
                </strong>

                Likes

              </div>

            </div>


            <div class="gain">

              📈 Views gained:

              <strong>
                +${formatNumber(video.viewsGained)}
              </strong>

            </div>


            <div class="gain">

              ❤️ Likes gained:

              <strong>
                +${formatNumber(video.likesGained)}
              </strong>

            </div>


            ${chartHTML}


            <a
              class="watch"
              href="${watchUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ▶ Watch on YouTube
            </a>

          </div>

        `;

      }).join("");


    /* =====================================
       LAST UPDATED
    ===================================== */

    document.getElementById("updated").textContent =
      `Last updated: ${new Date().toLocaleString()}`;


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="error">

        ❌ Unable to load fancams.

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =========================================
   FIRST LOAD
========================================= */

loadVideos();


/* =========================================
   AUTOMATIC REFRESH
   EVERY 60 SECONDS
========================================= */

setInterval(
  loadVideos,
  60000
);

</script>

</body>
</html>
